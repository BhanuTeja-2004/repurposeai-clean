version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: repurpose-ai-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: repurpose_ai
      MYSQL_USER: repurposeai
      MYSQL_PASSWORD: repurposeai123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: repurpose-ai-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_USERNAME: repurposeai
      DB_PASSWORD: repurposeai123
      JWT_SECRET: dev-jwt-secret-change-in-production-must-be-long
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
      STRIPE_PRICE_ID_PRO: ${STRIPE_PRICE_ID_PRO:-price_placeholder}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/repurpose_ai?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: repurpose-ai-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
