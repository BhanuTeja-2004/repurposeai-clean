# Server
server.port=8080
server.servlet.context-path=/api

# Database (PostgreSQL - Render)
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${JWT_SECRET:repurposeai-super-secret-key-change-in-production-minimum-256-bits}
app.jwt.expiration-ms=86400000

# OpenAI
openai.api.key=${OPENAI_API_KEY}
openai.api.url=https://api.openai.com/v1/chat/completions
openai.model=gpt-4o-mini

# Razorpay
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# CORS
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,https://yourdomain.com

# Free plan limits
app.free.daily-limit=3
app.pro.daily-limit=999999

# Logging
logging.level.com.repurposeai=INFO
logging.level.org.springframework.security=WARN